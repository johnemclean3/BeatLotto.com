<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatLotto.com</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>BeatLotto.com</h1>

        <label class="label" for="ticketCount">How many tickets?</label>
        <input type="number" id="ticketCount" min="1" max="100" value="1">

        <div class="button-row">
            <button id="generateButton">Generate Tickets</button>
            <button id="clearButton" class="clear">Clear</button>
        </div>

        <div class="tickets" id="tickets"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
